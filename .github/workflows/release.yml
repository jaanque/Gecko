name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release-binaries:
    name: Build & Publish Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify tests
        run: go test -count=1 ./internal/admin ./internal/config ./internal/linux ./internal/protocol ./internal/relay ./internal/security ./internal/video

      - name: Build release binaries
        env:
          CGO_ENABLED: "0"
          GOARCH: amd64
        run: |
          mkdir -p cmd/admin/assets dist
          GOOS=windows go build -trimpath -ldflags="-H=windowsgui -s -w" -o cmd/admin/assets/client_template.exe ./cmd/client
          GOOS=linux   go build -trimpath -ldflags="-s -w"              -o cmd/admin/assets/client_template_linux ./cmd/client
          GOOS=windows go build -trimpath -ldflags="-H=windowsgui -s -w" -o dist/AdminRemoto.exe ./cmd/admin
          GOOS=windows go build -trimpath -ldflags="-s -w"              -o dist/RelayServidor.exe ./cmd/relay
          GOOS=linux   go build -trimpath -ldflags="-s -w"              -o dist/RelayServidor ./cmd/relay
          (cd dist && sha256sum AdminRemoto.exe RelayServidor.exe RelayServidor > checksums.txt)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/AdminRemoto.exe \
            dist/RelayServidor.exe \
            dist/RelayServidor \
            dist/checksums.txt \
            --title "${{ github.ref_name }}" \
            --generate-notes

  release-docker:
    name: Publish Relay Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comprobar:
    name: Comprobar sistema
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Comprobar formato (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Archivos sin formatear con gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Análisis estático (go vet)
        env:
          CGO_ENABLED: "0"
          GOOS: windows
        run: |
          GOARCH=amd64 go vet ./...
          GOARCH=arm64 go vet ./...

      - name: Ejecutar pruebas unitarias
        env:
          CGO_ENABLED: "0"
        run: go test -v ./...

      - name: Compilar binarios de Windows (amd64 y arm64)
        run: |
          go run ./cmd/build -arch amd64
          go run ./cmd/build -arch arm64
          ls -lh dist/

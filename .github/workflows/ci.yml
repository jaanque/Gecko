name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Vet, Test (Linux) & Cross-Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet (Linux amd64)
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go vet ./...

      - name: Vet (Windows amd64)
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: go vet ./...

      - name: Vet (Windows arm64)
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: arm64
        run: go vet ./...

      - name: Vet (macOS arm64)
        env:
          CGO_ENABLED: "0"
          GOOS: darwin
          GOARCH: arm64
        run: go vet ./...

      - name: Test (Linux)
        run: go test -race -count=1 ./...

      - name: Cross-build all binaries
        run: |
          go run ./cmd/build
          ls -lh dist/windows/ dist/linux/ dist/macos/

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        env:
          CGO_ENABLED: "0"
          GOARCH: amd64
        run: go test -count=1 ./...

  docker:
    name: Build Relay Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t remote-relay:ci .

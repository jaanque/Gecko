<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06070a"/>
      <stop offset="50%" stop-color="#0b0e17"/>
      <stop offset="100%" stop-color="#101524"/>
    </linearGradient>

    <!-- Emerald Glow -->
    <radialGradient id="glowEmerald" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Cyan Glow -->
    <radialGradient id="glowCyan" cx="70%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Monitor Gradient -->
    <linearGradient id="monGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2436"/>
      <stop offset="100%" stop-color="#0f121d"/>
    </linearGradient>

    <!-- Display Screen Gradient -->
    <linearGradient id="dispGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1527"/>
      <stop offset="50%" stop-color="#091822"/>
      <stop offset="100%" stop-color="#051216"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="900" height="380" rx="16" fill="url(#bg)"/>
  <rect width="900" height="380" rx="16" fill="none" stroke="#1c2333" stroke-width="1.5"/>

  <!-- Atmospheric Glows -->
  <rect width="900" height="380" rx="16" fill="url(#glowEmerald)"/>
  <rect width="900" height="380" rx="16" fill="url(#glowCyan)"/>

  <!-- Grid lines (subtle perspective / tech pattern) -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="380"/>
    <line x1="250" y1="0" x2="250" y2="380"/>
    <line x1="400" y1="0" x2="400" y2="380"/>
    <line x1="550" y1="0" x2="550" y2="380"/>
    <line x1="700" y1="0" x2="700" y2="380"/>
    <line x1="850" y1="0" x2="850" y2="380"/>
    <line x1="0" y1="95" x2="900" y2="95"/>
    <line x1="0" y1="190" x2="900" y2="190"/>
    <line x1="0" y1="285" x2="900" y2="285"/>
  </g>

  <!-- Glowing Connection Beam behind monitors -->
  <path d="M 230 220 C 350 170, 550 170, 670 220" fill="none" stroke="url(#lineGrad)" stroke-width="2.5" stroke-dasharray="8,6"/>

  <!-- Monitor 1: Admin Operator (Right) -->
  <g transform="translate(560, 110)" filter="url(#dropShadow)">
    <!-- Stand -->
    <rect x="95" y="190" width="30" height="35" rx="3" fill="#1e2436"/>
    <ellipse cx="110" cy="226" rx="50" ry="8" fill="#151926" stroke="#2a334a" stroke-width="1"/>
    <!-- Monitor Body -->
    <rect x="0" y="0" width="220" height="195" rx="8" fill="url(#monGrad)" stroke="#2d374f" stroke-width="1.5"/>
    <!-- Screen -->
    <rect x="8" y="8" width="204" height="155" rx="4" fill="url(#dispGrad)"/>
    <!-- Window Bar -->
    <rect x="8" y="8" width="204" height="16" fill="#161b2b"/>
    <circle cx="18" cy="16" r="2.5" fill="#ef4444"/>
    <circle cx="26" cy="16" r="2.5" fill="#f59e0b"/>
    <circle cx="34" cy="16" r="2.5" fill="#10b981"/>
    <!-- Remote desktop display inside screen -->
    <circle cx="110" cy="90" r="32" fill="#0284c7" fill-opacity="0.12"/>
    <circle cx="110" cy="90" r="20" fill="#10b981" fill-opacity="0.15"/>
    <text x="110" y="98" text-anchor="middle" font-size="24">🖥️</text>
  </g>

  <!-- Monitor 2: Remote Client (Left) -->
  <g transform="translate(120, 130)" filter="url(#dropShadow)">
    <!-- Stand -->
    <rect x="85" y="170" width="26" height="30" rx="3" fill="#1e2436"/>
    <ellipse cx="98" cy="202" rx="42" ry="7" fill="#151926" stroke="#2a334a" stroke-width="1"/>
    <!-- Monitor Body -->
    <rect x="0" y="0" width="196" height="175" rx="8" fill="url(#monGrad)" stroke="#2d374f" stroke-width="1.5"/>
    <!-- Screen -->
    <rect x="7" y="7" width="182" height="138" rx="4" fill="url(#dispGrad)"/>
    <!-- Window Bar -->
    <rect x="7" y="7" width="182" height="15" fill="#161b2b"/>
    <circle cx="16" cy="14.5" r="2.2" fill="#ef4444"/>
    <circle cx="23" cy="14.5" r="2.2" fill="#f59e0b"/>
    <circle cx="30" cy="14.5" r="2.2" fill="#10b981"/>
    <!-- Client Prompt Dialog on Screen -->
    <rect x="25" y="45" width="146" height="75" rx="5" fill="#151b2a" stroke="#334155" stroke-width="1"/>
    <text x="98" y="65" text-anchor="middle" font-family="-apple-system, Segoe UI, sans-serif" font-size="8.5" font-weight="700" fill="#f8fafc">¿Permitir control?</text>
    <rect x="36" y="82" width="56" height="18" rx="3" fill="#10b981"/>
    <text x="64" y="94" text-anchor="middle" font-family="-apple-system, Segoe UI, sans-serif" font-size="7.5" font-weight="700" fill="#ffffff">Permitir</text>
    <rect x="102" y="82" width="56" height="18" rx="3" fill="#334155"/>
    <text x="130" y="94" text-anchor="middle" font-family="-apple-system, Segoe UI, sans-serif" font-size="7.5" font-weight="700" fill="#cbd5e1">Denegar</text>
  </g>

  <!-- Center Shield Emblem -->
  <g transform="translate(450, 190)" filter="url(#dropShadow)">
    <circle cx="0" cy="0" r="32" fill="#0d1322" stroke="#22c55e" stroke-width="2"/>
    <circle cx="0" cy="0" r="26" fill="#10b981" fill-opacity="0.12"/>
    <text x="0" y="1" text-anchor="middle" dominant-baseline="central" font-size="28">🦎</text>
  </g>

  <!-- Top Center Brand Title -->
  <g transform="translate(450, 52)" text-anchor="middle">
    <text font-family="-apple-system, Segoe UI, Helvetica, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="4">
      GECKO
    </text>
    <text y="24" font-family="-apple-system, Segoe UI, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" letter-spacing="1">
      SOPORTE Y CONTROL REMOTO PARA WINDOWS
    </text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f"/>
      <stop offset="50%" stop-color="#0f111a"/>
      <stop offset="100%" stop-color="#141824"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181c2b"/>
      <stop offset="100%" stop-color="#0d0f17"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="winShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="920" height="480" rx="16" fill="url(#bgGrad)"/>
  <rect width="920" height="480" rx="16" fill="none" stroke="#1e2638" stroke-width="1.5"/>

  <!-- Subtle ambient glow -->
  <circle cx="460" cy="80" r="140" fill="#10b981" opacity="0.08" filter="url(#glow)"/>
  <circle cx="200" cy="240" r="100" fill="#0078d4" opacity="0.05" filter="url(#glow)"/>

  <!-- Top Hero Header -->
  <g transform="translate(460, 48)" text-anchor="middle">
    <text font-family="-apple-system, Segoe UI, Helvetica, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="0.5">
      🦎 GECKO
    </text>
    <text y="24" font-family="-apple-system, Segoe UI, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">
      Control y Soporte Remoto Nativo para Windows
    </text>
  </g>

  <!-- Feature Pills -->
  <g transform="translate(460, 96)">
    <!-- Pill 1 -->
    <g transform="translate(-190, 0)">
      <rect x="-65" y="-12" width="130" height="24" rx="12" fill="#13201d" stroke="#10b981" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="-50" cy="0" r="3.5" fill="#10b981"/>
      <text x="-40" y="4" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#a7f3d0">DXGI 60 FPS GPU</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(0, 0)">
      <rect x="-70" y="-12" width="140" height="24" rx="12" fill="#171e2e" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="-55" cy="0" r="3.5" fill="#38bdf8"/>
      <text x="-45" y="4" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#bae6fd">Zero-Trust mTLS 1.3</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(190, 0)">
      <rect x="-65" y="-12" width="130" height="24" rx="12" fill="#1f1829" stroke="#c084fc" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="-50" cy="0" r="3.5" fill="#c084fc"/>
      <text x="-40" y="4" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#e9d5ff">0 Dependencias</text>
    </g>
  </g>

  <!-- Native Remote Viewer Window Mockup -->
  <g transform="translate(60, 130)" filter="url(#winShadow)">
    <!-- Window Frame -->
    <rect width="800" height="310" rx="10" fill="#131620" stroke="#262c3e" stroke-width="1.5"/>

    <!-- Window Titlebar -->
    <path d="M 0 10 Q 0 0 10 0 L 790 0 Q 800 0 800 10 L 800 40 L 0 40 Z" fill="#1a1e2c"/>
    <line x1="0" y1="40" x2="800" y2="40" stroke="#262c3e" stroke-width="1"/>

    <!-- Status dot & Window Title -->
    <circle cx="22" cy="20" r="4.5" fill="#22c55e"/>
    <text x="34" y="24" font-family="-apple-system, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">
      PC-OFICINA-VENTAS
    </text>
    <text x="175" y="24" font-family="-apple-system, Segoe UI, Consolas, monospace" font-size="11" fill="#64748b">
      · 1920×1080 · 60 FPS · 6 ms · DXGI
    </text>

    <!-- Toolbar Right Controls (Win32 Buttons) -->
    <!-- Monitor Tabs -->
    <rect x="420" y="9" width="34" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="437" y="24" text-anchor="middle" font-family="-apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="700" fill="#38bdf8">M1</text>

    <rect x="458" y="9" width="34" height="22" rx="4" fill="#1e293b"/>
    <text x="475" y="24" text-anchor="middle" font-family="-apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="600" fill="#94a3b8">M2</text>

    <rect x="496" y="9" width="46" height="22" rx="4" fill="#1e293b"/>
    <text x="519" y="24" text-anchor="middle" font-family="-apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="600" fill="#94a3b8">Todos</text>

    <!-- Quality Pill -->
    <rect x="550" y="9" width="46" height="22" rx="4" fill="#1e293b"/>
    <text x="573" y="24" text-anchor="middle" font-family="-apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="600" fill="#94a3b8">Alta</text>

    <!-- CAD Button -->
    <rect x="602" y="9" width="88" height="22" rx="4" fill="#1e293b"/>
    <text x="646" y="24" text-anchor="middle" font-family="-apple-system, Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#cbd5e1">Ctrl+Alt+Supr</text>

    <!-- Disconnect Button -->
    <rect x="696" y="9" width="88" height="22" rx="4" fill="#3f1d1d" stroke="#ef4444" stroke-width="1" stroke-opacity="0.4"/>
    <text x="740" y="24" text-anchor="middle" font-family="-apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="600" fill="#fca5a5">Desconectar</text>

    <!-- Remote Screen Viewport Canvas -->
    <rect x="12" y="50" width="776" height="248" rx="6" fill="url(#screenGrad)"/>
    <rect x="12" y="50" width="776" height="248" rx="6" fill="none" stroke="#222738" stroke-width="1"/>

    <!-- Simulated Desktop Wallpaper / Graphic inside remote screen -->
    <ellipse cx="400" cy="174" rx="260" ry="80" fill="#0078d4" opacity="0.07" filter="url(#glow)"/>
    <ellipse cx="400" cy="174" rx="120" ry="40" fill="#10b981" opacity="0.08" filter="url(#glow)"/>

    <!-- Windows Centered Card in Remote Session -->
    <g transform="translate(400, 160)">
      <rect x="-160" y="-45" width="320" height="90" rx="8" fill="#151926" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
      <circle cx="-130" cy="0" r="18" fill="#10b981" fill-opacity="0.15"/>
      <text x="-130" y="6" text-anchor="middle" font-size="16">⚡</text>
      <text x="-98" y="-8" font-family="-apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">
        Sesión Remota Activa
      </text>
      <text x="-98" y="10" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" fill="#94a3b8">
        Captura DXGI Directa por GPU a 60 FPS
      </text>
      <text x="-98" y="26" font-family="-apple-system, Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#22c55e">
        ● Cifrado mTLS 1.3 · Portapapeles sincronizado
      </text>
    </g>

    <!-- Simulated Windows Taskbar at bottom of remote session -->
    <rect x="13" y="268" width="774" height="29" fill="#0c0e17" fill-opacity="0.95"/>
    <line x1="13" y1="268" x2="787" y2="268" stroke="#1f2436" stroke-width="1"/>
    <!-- Windows Start Icon & Centered Icons -->
    <g transform="translate(400, 282)">
      <!-- Windows logo dots -->
      <rect x="-35" y="-5" width="4.5" height="4.5" fill="#38bdf8"/>
      <rect x="-29" y="-5" width="4.5" height="4.5" fill="#38bdf8"/>
      <rect x="-35" y="1" width="4.5" height="4.5" fill="#38bdf8"/>
      <rect x="-29" y="1" width="4.5" height="4.5" fill="#38bdf8"/>
      <!-- App icons -->
      <circle cx="-10" cy="0" r="4" fill="#64748b"/>
      <circle cx="6" cy="0" r="4" fill="#64748b"/>
      <circle cx="22" cy="0" r="4" fill="#64748b"/>
      <circle cx="38" cy="0" r="4" fill="#64748b"/>
    </g>
  </g>
</svg>

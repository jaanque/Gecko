<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="100%">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e17"/>
      <stop offset="100%" stop-color="#121624"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2030"/>
      <stop offset="100%" stop-color="#121624"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="920" height="220" rx="14" fill="url(#archBg)"/>
  <rect width="920" height="220" rx="14" fill="none" stroke="#1f2638" stroke-width="1.5"/>

  <!-- Connection Lines (Outbound mTLS arrows) -->
  <!-- Left to Center -->
  <path d="M 270 110 L 350 110" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,4"/>
  <polygon points="354,110 344,105 344,115" fill="#38bdf8"/>
  <g transform="translate(310, 96)">
    <rect x="-35" y="-10" width="70" height="20" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
    <text x="0" y="4" text-anchor="middle" font-family="-apple-system, Segoe UI, sans-serif" font-size="9" font-weight="700" fill="#38bdf8">🔒 mTLS 1.3</text>
  </g>

  <!-- Right to Center -->
  <path d="M 650 110 L 570 110" stroke="#818cf8" stroke-width="2" stroke-dasharray="6,4"/>
  <polygon points="566,110 576,105 576,115" fill="#818cf8"/>
  <g transform="translate(610, 96)">
    <rect x="-35" y="-10" width="70" height="20" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5"/>
    <text x="0" y="4" text-anchor="middle" font-family="-apple-system, Segoe UI, sans-serif" font-size="9" font-weight="700" fill="#a5b4fc">🔒 mTLS 1.3</text>
  </g>

  <!-- CARD 1: Cliente Remoto (Left) -->
  <g transform="translate(40, 30)" filter="url(#cardShadow)">
    <rect width="230" height="160" rx="10" fill="url(#cardGrad)" stroke="#273248" stroke-width="1.2"/>
    <rect x="16" y="16" width="36" height="36" rx="8" fill="#0284c7" fill-opacity="0.15"/>
    <text x="34" y="40" text-anchor="middle" font-size="18">💻</text>
    <text x="62" y="32" font-family="-apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">ClientRemot.exe</text>
    <text x="62" y="48" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" font-weight="500" fill="#38bdf8">Equipo Asistido</text>

    <line x1="16" y1="64" x2="214" y2="64" stroke="#222b3d" stroke-width="1"/>

    <text x="20" y="86" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" fill="#94a3b8">✔ 0 MB de instalación (Portable)</text>
    <text x="20" y="106" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" fill="#94a3b8">✔ Consentimiento obligatorio</text>
    <text x="20" y="126" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" fill="#94a3b8">✔ Captura directa GPU DXGI</text>
    <text x="20" y="146" font-family="-apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="600" fill="#38bdf8">Conexión saliente (sin abrir puertos)</text>
  </g>

  <!-- CARD 2: Relay Server (Center) -->
  <g transform="translate(345, 20)" filter="url(#cardShadow)">
    <rect width="230" height="180" rx="10" fill="#141a27" stroke="#22c55e" stroke-width="1.5" stroke-opacity="0.6"/>
    <rect x="16" y="16" width="36" height="36" rx="8" fill="#16a34a" fill-opacity="0.2"/>
    <text x="34" y="40" text-anchor="middle" font-size="18">🌐</text>
    <text x="62" y="32" font-family="-apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">RelayServidor.exe</text>
    <text x="62" y="48" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#4ade80">Servidor Puente (Auto-alojado)</text>

    <line x1="16" y1="64" x2="214" y2="64" stroke="#273248" stroke-width="1"/>

    <text x="20" y="86" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" fill="#94a3b8">✔ Puente mTLS 1.3 con Pinning</text>
    <text x="20" y="106" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" fill="#94a3b8">✔ PKI privada y tokens por rol</text>
    <text x="20" y="126" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" fill="#94a3b8">✔ Revocación por cliente en 1 clic</text>
    <text x="20" y="146" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" fill="#94a3b8">✔ Auditoría y Rate Limiting por IP</text>
    <text x="20" y="166" font-family="-apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="700" fill="#22c55e">Puerto TCP 9443 único expuesto</text>
  </g>

  <!-- CARD 3: Admin Console (Right) -->
  <g transform="translate(650, 30)" filter="url(#cardShadow)">
    <rect width="230" height="160" rx="10" fill="url(#cardGrad)" stroke="#273248" stroke-width="1.2"/>
    <rect x="16" y="16" width="36" height="36" rx="8" fill="#4f46e5" fill-opacity="0.15"/>
    <text x="34" y="40" text-anchor="middle" font-size="18">🎛️</text>
    <text x="62" y="32" font-family="-apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">AdminRemoto.exe</text>
    <text x="62" y="48" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" font-weight="500" fill="#818cf8">Consola de Control</text>

    <line x1="16" y1="64" x2="214" y2="64" stroke="#222b3d" stroke-width="1"/>

    <text x="20" y="86" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" fill="#94a3b8">✔ Visor Win32 fluido a 60 FPS</text>
    <text x="20" y="106" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" fill="#94a3b8">✔ Soporte multimonitor dinámico</text>
    <text x="20" y="126" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" fill="#94a3b8">✔ Envío de archivos y portapapeles</text>
    <text x="20" y="146" font-family="-apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="600" fill="#818cf8">Generador de clientes integrado</text>
  </g>
</svg>

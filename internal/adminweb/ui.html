<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gecko Admin</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--ink:#18181b;--muted:#71717a;--line:#e4e4e7;--ok:#16a34a;--warn:#d97706;--err:#dc2626;}
  *{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  body{margin:0;background:var(--bg);color:var(--ink);}
  header{background:var(--card);border-bottom:1px solid var(--line);height:56px;padding:0 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;}
  .brand{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;}
  .ver{font-size:11px;color:var(--muted);font-family:ui-monospace,monospace;}
  .tabs{display:flex;gap:6px;margin-left:8px;}
  .tab{border:0;background:transparent;padding:7px 12px;border-radius:7px;font-weight:600;font-size:13px;color:#3f3f46;cursor:pointer;}
  .tab.active{background:var(--ink);color:#fff;}
  .tab:hover:not(.active){background:#f4f4f5;}
  .spacer{flex:1;}
  .pill{display:flex;align-items:center;gap:8px;padding:5px 11px;border-radius:7px;background:var(--bg);border:1px solid var(--line);font-size:12px;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);}
  .dot.ok{background:var(--ok);} .dot.warn{background:var(--warn);} .dot.err{background:var(--err);}
  select.lang{border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:#fff;font-size:12px;cursor:pointer;}
  main{max-width:960px;margin:20px auto;padding:0 20px;}
  .banner{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;}
  .banner.err{background:#fef2f2;border-color:#fecaca;color:#b91c1c;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;}
  .search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:14px;font-size:13px;}
  .row{display:flex;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px solid #f4f4f5;}
  .row:last-child{border-bottom:0;}
  .row-info{flex:1;min-width:0;}
  .row-title{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;}
  .badge{font-size:11px;padding:2px 7px;border-radius:5px;background:#f4f4f5;color:#3f3f46;font-weight:600;}
  .row-meta{font-size:12px;color:var(--muted);font-family:ui-monospace,monospace;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 13px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;}
  .btn:hover{background:#f4f4f5;}
  .btn.primary{background:var(--ink);border-color:var(--ink);color:#fff;}
  .btn.primary:hover{background:#27272a;}
  .btn.danger{border-color:#fecaca;color:#b91c1c;}
  .btn.danger:hover{background:#fef2f2;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  label.fld{display:block;font-size:13px;font-weight:600;margin:14px 0 6px;}
  input.txt,select.sel{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;font-size:13px;font-family:ui-monospace,monospace;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line);}
  .empty{text-align:center;padding:42px 16px;color:var(--muted);}
  .hidden{display:none!important;}
  /* Remote Viewer */
  #viewer{position:fixed;inset:0;background:#141518;z-index:100;display:flex;flex-direction:column;}
  .vbar{height:46px;background:#fff;border-bottom:1px solid var(--line);padding:0 12px;display:flex;align-items:center;gap:8px;flex-wrap:nowrap;overflow-x:auto;}
  .vstats{font-size:12px;color:var(--muted);font-family:ui-monospace,monospace;white-space:nowrap;}
  .vstage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
  canvas#screen{max-width:100%;max-height:100%;outline:none;cursor:default;background:#000;}
  .vbtn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:5px 9px;border-radius:5px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .vbtn.active{background:var(--ink);border-color:var(--ink);color:#fff;}
  .vbtn.danger{border-color:#fecaca;color:#b91c1c;}
  .vsep{width:1px;height:20px;background:var(--line);}
</style>
</head>
<body>
<header>
  <div class="brand">🦎 Gecko <span id="ver" class="ver"></span></div>
  <div class="tabs">
    <button class="tab active" data-tab="devices" id="t-devices"></button>
    <button class="tab" data-tab="builder" id="t-builder"></button>
    <button class="tab" data-tab="server" id="t-server"></button>
  </div>
  <div class="spacer"></div>
  <div class="pill" id="relay-pill"><span class="dot" id="relay-dot"></span><span id="relay-txt"></span></div>
  <select class="lang" id="lang-sel" aria-label="Language">
    <option value="ca">Català</option>
    <option value="es">Español</option>
    <option value="en">English</option>
  </select>
</header>

<main>
  <div id="pending-bar" class="banner hidden">
    <span><strong id="pending-txt"></strong></span>
    <button class="btn" id="btn-cancel-pending"></button>
  </div>
  <div id="notice-bar" class="banner hidden">
    <span id="notice-txt"></span>
    <button class="btn" id="btn-close-notice">×</button>
  </div>

  <section id="tab-devices" class="card">
    <input class="search" id="search-box" type="search">
    <div id="device-list"></div>
  </section>

  <section id="tab-builder" class="card hidden">
    <div class="grid2">
      <div>
        <label class="fld" id="lbl-platform"></label>
        <select class="sel" id="b-platform">
          <option value="windows">Windows (.exe)</option>
          <option value="linux">Linux (X11 / Wayland)</option>
          <option value="darwin">macOS</option>
        </select>
      </div>
      <div>
        <label class="fld" id="lbl-clang"></label>
        <select class="sel" id="b-lang">
          <option value="ca">Català</option>
          <option value="es">Español</option>
          <option value="en">English</option>
        </select>
      </div>
    </div>
    <label class="fld" id="lbl-label"></label>
    <input class="txt" id="b-label" type="text" placeholder="Ex. Portatil-Recepcio">
    <label class="fld" id="lbl-logo"></label>
    <input type="file" id="b-logo" accept="image/png,image/jpeg">
    <div class="actions">
      <button class="btn primary" id="btn-build"></button>
    </div>
  </section>

  <section id="tab-server" class="card hidden">
    <label class="fld" id="lbl-key"></label>
    <input class="txt" id="s-key" type="text" placeholder="RMT2:...">
    <label class="fld" id="lbl-addr"></label>
    <input class="txt" id="s-addr" type="text" placeholder="suport.domini.cat:9443">
    <div class="actions">
      <button class="btn primary" id="btn-save-server"></button>
    </div>
  </section>
</main>

<div id="viewer" class="hidden">
  <div class="vbar" id="vbar">
    <span class="dot ok"></span>
    <strong id="v-host"></strong>
    <span class="vstats" id="v-stats"></span>
    <div class="spacer"></div>
    <div id="v-mons" style="display:flex;gap:4px;"></div>
    <div class="vsep"></div>
    <button class="vbtn" data-q="55" id="vq-low"></button>
    <button class="vbtn active" data-q="78" id="vq-med"></button>
    <button class="vbtn" data-q="92" id="vq-hi"></button>
    <div class="vsep"></div>
    <button class="vbtn" id="v-clip"></button>
    <button class="vbtn" id="v-file"></button>
    <input type="file" id="v-file-input" class="hidden">
    <button class="vbtn" id="v-cad">CAD</button>
    <button class="vbtn" id="v-full">F11</button>
    <button class="vbtn danger" id="v-disc"></button>
  </div>
  <div class="vstage">
    <canvas id="screen" tabindex="0"></canvas>
  </div>
</div>

<script>
const I18N = {
  ca: {
    devices: "Equips", builder: "Crear client", server: "Servidor",
    online: "En línia", connecting: "Connectant...", noServer: "Sense servidor",
    search: "Cercar per equip, usuari, SO o IP...", empty: "No hi ha equips connectats",
    connect: "Connectar", revoke: "Revocar", available: "Disponible", pending: "Esperant...", active: "En sessió",
    waitPrefix: "Esperant confirmació a ", cancel: "Cancel·lar",
    platform: "Plataforma", clang: "Idioma del client", label: "Etiqueta de la credencial (opcional)",
    logo: "Logotip opcional (PNG/JPG)", buildBtn: "Descarregar client",
    key: "Clau del servidor (RMT2:...)", addr: "Adreça (host:port, opcional si ve a la clau)", saveServer: "Desar i connectar",
    low: "Baixa", med: "Estàndard", hi: "Alta", allMon: "Tots",
    clip: "Portapapers", file: "Fitxer", disc: "Desconnectar",
    revokeConfirm: "Revocar aquesta credencial? L'equip es desconnectarà ara mateix.",
    clipPrompt: "Text a enviar al portapapers remot:",
  },
  es: {
    devices: "Equipos", builder: "Crear cliente", server: "Servidor",
    online: "En línea", connecting: "Conectando...", noServer: "Sin servidor",
    search: "Buscar por equipo, usuario, SO o IP...", empty: "No hay equipos conectados",
    connect: "Conectar", revoke: "Revocar", available: "Disponible", pending: "Esperando...", active: "En sesión",
    waitPrefix: "Esperando confirmación en ", cancel: "Cancelar",
    platform: "Plataforma", clang: "Idioma del cliente", label: "Etiqueta de la credencial (opcional)",
    logo: "Logo opcional (PNG/JPG)", buildBtn: "Descargar cliente",
    key: "Clave del servidor (RMT2:...)", addr: "Dirección (host:puerto, opcional si viene en la clave)", saveServer: "Guardar y conectar",
    low: "Baja", med: "Estándar", hi: "Alta", allMon: "Todos",
    clip: "Portapapeles", file: "Archivo", disc: "Desconectar",
    revokeConfirm: "¿Revocar esta credencial? El equipo se desconectará inmediatamente.",
    clipPrompt: "Texto a enviar al portapapeles remoto:",
  },
  en: {
    devices: "Devices", builder: "Create client", server: "Server",
    online: "Online", connecting: "Connecting...", noServer: "No server",
    search: "Search by hostname, user, OS or IP...", empty: "No devices connected",
    connect: "Connect", revoke: "Revoke", available: "Available", pending: "Waiting...", active: "In session",
    waitPrefix: "Waiting for consent on ", cancel: "Cancel",
    platform: "Platform", clang: "Client language", label: "Credential label (optional)",
    logo: "Optional logo (PNG/JPG)", buildBtn: "Download client",
    key: "Server key (RMT2:...)", addr: "Address (host:port, optional if embedded)", saveServer: "Save & connect",
    low: "Low", med: "Standard", hi: "High", allMon: "All",
    clip: "Clipboard", file: "Send file", disc: "Disconnect",
    revokeConfirm: "Revoke this credential? The device will disconnect immediately.",
    clipPrompt: "Text to send to remote clipboard:",
  }
};

const token = new URLSearchParams(location.search).get("token") || "";
let lang = "ca";
let state = { clients: [], hasProfile: false, relayOK: false, relayDetail: "", rtt: -1, fps: 0, frames: 0, fpsAt: performance.now(), monCount: 1, activeMon: 0, quality: 78, statusText: "" };
let ws;

const $ = id => document.getElementById(id);
const t = k => (I18N[lang] || I18N.ca)[k] || k;

function applyI18n() {
  $("t-devices").textContent = `${t("devices")} (${state.clients.length})`;
  $("t-builder").textContent = t("builder");
  $("t-server").textContent = t("server");
  $("search-box").placeholder = t("search");
  $("btn-cancel-pending").textContent = t("cancel");
  $("lbl-platform").textContent = t("platform");
  $("lbl-clang").textContent = t("clang");
  $("lbl-label").textContent = t("label");
  $("lbl-logo").textContent = t("logo");
  $("btn-build").textContent = t("buildBtn");
  $("lbl-key").textContent = t("key");
  $("lbl-addr").textContent = t("addr");
  $("btn-save-server").textContent = t("saveServer");
  $("vq-low").textContent = t("low");
  $("vq-med").textContent = t("med");
  $("vq-hi").textContent = t("hi");
  $("v-clip").textContent = t("clip");
  $("v-file").textContent = t("file");
  $("v-disc").textContent = t("disc");
  renderRelayStatus();
  renderClients();
  renderMonitors();
}

function showTab(name) {
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b.dataset.tab === name));
  ["devices","builder","server"].forEach(n => $("tab-"+n).classList.toggle("hidden", n !== name));
}
document.querySelectorAll(".tab").forEach(b => b.onclick = () => showTab(b.dataset.tab));
$("lang-sel").onchange = e => { lang = e.target.value; applyI18n(); };

function showNotice(msg, isErr) {
  $("notice-txt").textContent = msg;
  $("notice-bar").classList.toggle("err", !!isErr);
  $("notice-bar").classList.remove("hidden");
}
$("btn-close-notice").onclick = () => $("notice-bar").classList.add("hidden");

function renderRelayStatus() {
  const dot = $("relay-dot"), txt = $("relay-txt");
  dot.className = "dot " + (!state.hasProfile ? "" : state.relayOK ? "ok" : "warn");
  txt.textContent = !state.hasProfile ? t("noServer") : state.relayOK ? t("online") : (state.relayDetail || t("connecting"));
}

function renderClients() {
  $("t-devices").textContent = `${t("devices")} (${state.clients.length})`;
  const q = ($("search-box").value || "").trim().toLowerCase();
  const list = state.clients.filter(c => !q ||
    (c.hostname||"").toLowerCase().includes(q) ||
    (c.username||"").toLowerCase().includes(q) ||
    (c.os||"").toLowerCase().includes(q) ||
    (c.ip||"").toLowerCase().includes(q));
  const root = $("device-list");
  if (!list.length) {
    root.innerHTML = `<div class="empty">${t("empty")}</div>`;
    return;
  }
  root.innerHTML = "";
  for (const c of list) {
    const row = document.createElement("div");
    row.className = "row";
    const dotCls = c.status === "online" ? "ok" : c.status === "pending" ? "warn" : "";
    const meta = [c.username, c.ip, c.width ? `${c.width}×${c.height}` : "", c.monitor_count > 1 ? `${c.monitor_count}M` : "", c.version ? `v${c.version.replace(/^v/,"")}` : ""].filter(Boolean).join(" · ");
    const osBadge = c.os ? `<span class="badge">${c.os}</span>` : "";
    row.innerHTML = `<span class="dot ${dotCls}"></span>
      <div class="row-info">
        <div class="row-title"><span></span>${osBadge}</div>
        <div class="row-meta"></div>
      </div>`;
    row.querySelector(".row-title span").textContent = c.hostname;
    row.querySelector(".row-meta").textContent = meta;

    if (c.credential_id) {
      const rev = document.createElement("button");
      rev.className = "btn danger";
      rev.textContent = t("revoke");
      rev.onclick = () => {
        if (confirm(t("revokeConfirm"))) sendWS({ type: "revoke", credential_id: c.credential_id, client_id: c.id });
      };
      row.appendChild(rev);
    }
    const conn = document.createElement("button");
    conn.className = "btn primary";
    conn.textContent = t("connect");
    conn.disabled = c.status !== "online";
    conn.onclick = () => sendWS({ type: "connect", client_id: c.id });
    row.appendChild(conn);
    root.appendChild(row);
  }
}
$("search-box").oninput = renderClients;

function sendWS(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
}

// Remote viewer canvas & binary frame decoder
const canvas = $("screen");
const ctx = canvas.getContext("2d");

function openViewer(host, w, h, monCount) {
  $("v-host").textContent = host;
  canvas.width = w || 1280;
  canvas.height = h || 720;
  state.monCount = monCount || 1;
  state.activeMon = 0;
  state.quality = 78;
  state.rtt = -1;
  state.fps = 0;
  state.frames = 0;
  state.fpsAt = performance.now();
  renderMonitors();
  updateStats();
  $("viewer").classList.remove("hidden");
  canvas.focus();
}

function closeViewer() {
  if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
  $("viewer").classList.add("hidden");
}

function renderMonitors() {
  const box = $("v-mons");
  box.innerHTML = "";
  if (state.monCount <= 1) return;
  for (let i = 0; i < Math.min(state.monCount, 6); i++) {
    const b = document.createElement("button");
    b.className = "vbtn" + (state.activeMon === i ? " active" : "");
    b.textContent = `M${i+1}`;
    b.onclick = () => { state.activeMon = i; renderMonitors(); sendWS({ type: "monitor", monitor: i }); };
    box.appendChild(b);
  }
  const all = document.createElement("button");
  all.className = "vbtn" + (state.activeMon === -1 ? " active" : "");
  all.textContent = t("allMon");
  all.onclick = () => { state.activeMon = -1; renderMonitors(); sendWS({ type: "monitor", monitor: -1 }); };
  box.appendChild(all);
}

function updateStats() {
  if (state.statusText) { $("v-stats").textContent = state.statusText; return; }
  const parts = [`${canvas.width}×${canvas.height}`, `${state.fps} fps`];
  if (state.rtt >= 0) parts.push(`${state.rtt} ms`);
  $("v-stats").textContent = parts.join(" · ");
}

async function handleBinaryFrame(buf) {
  const dv = new DataView(buf);
  if (buf.byteLength < 10) return;
  const w = dv.getUint16(4), h = dv.getUint16(6), count = dv.getUint16(8);
  if (w > 0 && h > 0 && (canvas.width !== w || canvas.height !== h)) {
    canvas.width = w; canvas.height = h;
  }
  let off = 10;
  for (let i = 0; i < count && off + 13 <= buf.byteLength; i++) {
    const tx = dv.getUint16(off), ty = dv.getUint16(off+2), tw = dv.getUint16(off+4), th = dv.getUint16(off+6);
    const codec = dv.getUint8(off+8), dlen = dv.getUint32(off+9);
    off += 13;
    if (dlen <= 0 || off + dlen > buf.byteLength) break;
    const slice = new Uint8Array(buf, off, dlen);
    off += dlen;
    if (codec === 2 && dlen === tw * th * 4) {
      const img = new ImageData(new Uint8ClampedArray(slice.buffer, slice.byteOffset, dlen), tw, th);
      ctx.putImageData(img, tx, ty);
    } else if (codec === 0) {
      const blob = new Blob([slice], { type: "image/jpeg" });
      try {
        const bmp = await createImageBitmap(blob);
        ctx.drawImage(bmp, tx, ty);
        bmp.close();
      } catch {}
    }
  }
  state.frames++;
  const now = performance.now();
  if (now - state.fpsAt >= 1000) {
    state.fps = Math.round(state.frames * 1000 / (now - state.fpsAt));
    state.frames = 0; state.fpsAt = now;
    updateStats();
  }
}

// Mouse & keyboard forwarding
function normCoords(e) {
  const r = canvas.getBoundingClientRect();
  const x = Math.max(0, Math.min(1, (e.clientX - r.left) / Math.max(1, r.width)));
  const y = Math.max(0, Math.min(1, (e.clientY - r.top) / Math.max(1, r.height)));
  return [Math.round(x * 65535), Math.round(y * 65535)];
}
const mapBtn = b => b === 2 ? 1 : b === 1 ? 2 : b === 3 ? 3 : b === 4 ? 4 : 0;
let lastMove = 0;
canvas.onmousemove = e => {
  const now = performance.now();
  if (now - lastMove < 10) return;
  lastMove = now;
  const [x, y] = normCoords(e);
  sendWS({ type: "mouse", action: 0, x, y });
};
canvas.onmousedown = e => { e.preventDefault(); canvas.focus(); const [x, y] = normCoords(e); sendWS({ type: "mouse", action: 1, button: mapBtn(e.button), x, y }); };
canvas.onmouseup = e => { e.preventDefault(); const [x, y] = normCoords(e); sendWS({ type: "mouse", action: 2, button: mapBtn(e.button), x, y }); };
canvas.oncontextmenu = e => e.preventDefault();
canvas.onwheel = e => { e.preventDefault(); sendWS({ type: "mouse", action: 3, delta: e.deltaY < 0 ? 120 : -120 }); };

const CODE_TO_VK = {
  Backspace:[0x08,0x0E,0], Tab:[0x09,0x0F,0], Enter:[0x0D,0x1C,0], ShiftLeft:[0xA0,0x2A,0], ShiftRight:[0xA1,0x36,0],
  ControlLeft:[0xA2,0x1D,0], ControlRight:[0xA3,0x1D,1], AltLeft:[0xA4,0x38,0], AltRight:[0xA5,0x38,1],
  CapsLock:[0x14,0x3A,0], Escape:[0x1B,0x01,0], Space:[0x20,0x39,0],
  PageUp:[0x21,0x49,1], PageDown:[0x22,0x51,1], End:[0x23,0x4F,1], Home:[0x24,0x47,1],
  ArrowLeft:[0x25,0x4B,1], ArrowUp:[0x26,0x48,1], ArrowRight:[0x27,0x4D,1], ArrowDown:[0x28,0x50,1],
  Insert:[0x2D,0x52,1], Delete:[0x2E,0x53,1], MetaLeft:[0x5B,0x5B,1], MetaRight:[0x5C,0x5C,1],
  Semicolon:[0xBA,0x27,0], Equal:[0xBB,0x0D,0], Comma:[0xBC,0x33,0], Minus:[0xBD,0x0C,0],
  Period:[0xBE,0x34,0], Slash:[0xBF,0x35,0], Backquote:[0xC0,0x29,0],
  BracketLeft:[0xDB,0x1A,0], Backslash:[0xDC,0x2B,0], BracketRight:[0xDD,0x1B,0], Quote:[0xDE,0x28,0], IntlBackslash:[0xE2,0x56,0],
};
function mapKey(e) {
  if (CODE_TO_VK[e.code]) return CODE_TO_VK[e.code];
  if (/^Key([A-Z])$/.test(e.code)) return [e.code.charCodeAt(3), 0, 0];
  if (/^Digit([0-9])$/.test(e.code)) return [e.code.charCodeAt(5), 0, 0];
  if (/^F([1-9]|1[0-2])$/.test(e.code)) return [0x6F + parseInt(e.code.slice(1),10), 0, 0];
  return null;
}
function handleKey(down, e) {
  if ($("viewer").classList.contains("hidden")) return;
  if (e.code === "F11" && down) { e.preventDefault(); toggleFull(); return; }
  if (e.ctrlKey && e.altKey && e.code === "KeyQ" && down) { e.preventDefault(); disconnectViewer(); return; }
  if (e.ctrlKey && e.altKey && e.code === "KeyM" && down) { e.preventDefault(); $("vbar").classList.toggle("hidden"); return; }
  const m = mapKey(e);
  if (!m) return;
  e.preventDefault();
  sendWS({ type: "key", action: down ? 0 : 1, vk: m[0], scan: m[1], flags: m[2] });
}
window.addEventListener("keydown", e => handleKey(true, e));
window.addEventListener("keyup", e => handleKey(false, e));

function toggleFull() {
  if (!document.fullscreenElement) $("viewer").requestFullscreen().catch(()=>{});
  else document.exitFullscreen().catch(()=>{});
}
function disconnectViewer() { sendWS({ type: "disconnect" }); closeViewer(); }

document.querySelectorAll("[data-q]").forEach(b => b.onclick = () => {
  state.quality = parseInt(b.dataset.q, 10);
  document.querySelectorAll("[data-q]").forEach(x => x.classList.toggle("active", x === b));
  sendWS({ type: "quality", quality: state.quality });
});
$("v-full").onclick = toggleFull;
$("v-disc").onclick = disconnectViewer;
$("v-cad").onclick = () => sendWS({ type: "system_action", sys_action: "ctrl_alt_del" });
$("v-clip").onclick = async () => {
  let txt = "";
  try { txt = await navigator.clipboard.readText(); } catch {}
  txt = prompt(t("clipPrompt"), txt || "");
  if (txt) sendWS({ type: "clipboard", text: txt });
};
$("v-file").onclick = () => $("v-file-input").click();
$("v-file-input").onchange = async e => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  const fd = new FormData(); fd.append("file", f);
  state.statusText = `⬆ ${f.name}...`; updateStats();
  const res = await fetch(`/api/upload?token=${encodeURIComponent(token)}`, { method: "POST", body: fd });
  if (!res.ok) state.statusText = `Error: ${await res.text()}`;
  updateStats();
  setTimeout(() => { state.statusText = ""; updateStats(); }, 5000);
};
$("btn-cancel-pending").onclick = () => { $("pending-bar").classList.add("hidden"); sendWS({ type: "cancel_pending" }); };

$("btn-save-server").onclick = async () => {
  const res = await fetch(`/api/server?token=${encodeURIComponent(token)}`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ key: $("s-key").value.trim(), addr: $("s-addr").value.trim() }),
  });
  if (!res.ok) { showNotice(await res.text(), true); return; }
  const j = await res.json();
  state.hasProfile = true;
  $("s-addr").value = j.server_addr || "";
  showTab("devices");
  renderRelayStatus();
};

$("btn-build").onclick = async () => {
  const fd = new FormData();
  fd.append("platform", $("b-platform").value);
  fd.append("lang", $("b-lang").value);
  fd.append("label", $("b-label").value.trim());
  if ($("b-logo").files[0]) fd.append("logo", $("b-logo").files[0]);
  const res = await fetch(`/api/generate-client?token=${encodeURIComponent(token)}`, { method: "POST", body: fd });
  if (!res.ok) { showNotice(await res.text(), true); return; }
  const blob = await res.blob();
  const disp = res.headers.get("Content-Disposition") || "";
  const m = /filename="([^"]+)"/.exec(disp);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = m ? m[1] : "ClientRemot";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};

function connectWS() {
  ws = new WebSocket(`ws://${location.host}/ws?token=${encodeURIComponent(token)}`);
  ws.binaryType = "arraybuffer";
  ws.onmessage = ev => {
    if (ev.data instanceof ArrayBuffer) { handleBinaryFrame(ev.data); return; }
    const m = JSON.parse(ev.data);
    switch (m.type) {
      case "init":
        $("ver").textContent = "v" + (m.version || "");
        lang = m.default_lang || "ca";
        $("lang-sel").value = lang;
        state.hasProfile = m.has_profile;
        state.relayOK = m.relay_connected;
        state.relayDetail = m.relay_detail;
        state.clients = m.clients || [];
        $("s-addr").value = m.server_addr || "";
        if (!state.hasProfile) showTab("server");
        applyI18n();
        break;
      case "relay_status":
        state.relayOK = m.connected; state.relayDetail = m.detail; renderRelayStatus(); break;
      case "clients":
        state.clients = m.clients || []; renderClients(); break;
      case "session_pending":
        $("pending-txt").textContent = t("waitPrefix") + m.hostname + "...";
        $("pending-bar").classList.remove("hidden"); break;
      case "session_started":
        $("pending-bar").classList.add("hidden");
        openViewer(m.hostname, m.width, m.height, m.monitor_count); break;
      case "session_denied":
        $("pending-bar").classList.add("hidden");
        showNotice(`${m.hostname}: ${m.reason}`, true); break;
      case "session_ended":
        $("pending-bar").classList.add("hidden");
        closeViewer();
        showNotice(`${m.hostname ? m.hostname + ": " : ""}${m.reason}`, false); break;
      case "session_error":
        $("pending-bar").classList.add("hidden");
        showNotice(m.reason, true); break;
      case "latency":
        state.rtt = m.rtt_ms; updateStats(); break;
      case "clipboard":
        if (m.text && navigator.clipboard) navigator.clipboard.writeText(m.text).catch(()=>{});
        break;
      case "file_status":
        state.statusText = m.detail; updateStats();
        setTimeout(() => { state.statusText = ""; updateStats(); }, 5000); break;
    }
  };
  ws.onclose = () => setTimeout(connectWS, 1500);
}
connectWS();
</script>
